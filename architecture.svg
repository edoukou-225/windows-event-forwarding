<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-label="One collector per tier, and only outbound flows to the SIEM" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
