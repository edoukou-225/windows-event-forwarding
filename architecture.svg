  <text x="276" y="108" font-weight="600" fill="#1a1a1a">WEC-T0</text>
  <text x="276" y="124" font-size="11.5" fill="#1a1a1a">ForwardedEvents buffer</text>
  <text x="276" y="140" font-size="11.5" fill="#1a1a1a">NXLog CE agent</text>
